# Публікація застосунку на GitHub Pages після пушу в dev (docs/architecture.md, «Хостинг»):
#   /dialer/  застосунок apps/web (entries/app.ts): вхід за номером, контакти й дзвінки через бекенд на Fly.io.
# Демо-сторінка, embed.js і віджет лишаються в репозиторії для локальної розробки й на Pages не публікуються.
name: Pages

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  SERVER: https://dialer-chat-server.fly.dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @dialer/web...
      - run: pnpm --filter @dialer/web build
        env:
          VITE_SERVER_URL: ${{ env.SERVER }}
      - name: Build site
        run: |
          cp -r apps/web/dist _site
          # віджет для iframe на Pages не потрібен
          rm _site/widget.html
          test -f _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
