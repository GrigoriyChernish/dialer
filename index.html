<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Дзвонілка: демо фіч</title>
<style>
:root{--bg:#0b0d12;--glass:rgba(255,255,255,.08);--line:rgba(255,255,255,.12);--fg:#f3f5fa;--mute:#98a2b6;--acc:#6366f1;--ok:#22c55e;--bad:#ef4444;--card:#161a24;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#eef0f6;--line:rgba(20,24,38,.1);--fg:#12151f;--mute:#5b6478;--card:#fff}}
:root[data-theme="light"]{--bg:#eef0f6;--line:rgba(20,24,38,.1);--fg:#12151f;--mute:#5b6478;--card:#fff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;justify-content:center;padding:16px;background:var(--bg);color:var(--fg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
.app{width:100%;max-width:400px}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg .f{fill:currentColor;stroke:none}
.head{display:flex;justify-content:space-between;align-items:center;margin:2px 4px 12px}
.head b{font-size:16px}
.chip{all:unset;cursor:pointer;font-size:12px;padding:6px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--mute)}
.list{background:linear-gradient(160deg,#141826,#0b0d12);color:#f3f5fa;border:1px solid var(--line);border-radius:28px;padding:18px 12px 10px}
.list h2{margin:0 8px 10px;font-size:22px;letter-spacing:-.02em}
.row{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:14px;width:100%;padding:11px 10px;border-radius:18px;cursor:pointer;transition:background .2s}
.row:hover{background:rgba(255,255,255,.08)}
.meta{flex:1;display:grid;gap:2px}.meta small{color:#98a2b6}
.dial{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(34,197,94,.15);color:var(--ok)}
.avatar{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:600;color:#fff;background:linear-gradient(135deg,#6366f1,#a855f7);flex:none}
.avatar.xl{width:104px;height:104px;font-size:34px}.avatar.dim{filter:grayscale(.7) brightness(.8)}
.stage{position:relative;color:#f3f5fa;aspect-ratio:9/16;max-height:78vh;border-radius:32px;overflow:hidden;background:radial-gradient(120% 80% at 50% 0%,#1e2340,#0b0d12);border:1px solid var(--line);box-shadow:0 30px 60px -20px rgba(0,0,0,.6)}
.stage.missed{background:radial-gradient(120% 80% at 50% 0%,#2a1e28,#0b0d12)}
.center{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:6px;text-align:center;padding:0 24px 60px}
.center h3{margin:18px 0 0;font-size:26px;letter-spacing:-.02em}.center p{margin:0;color:#98a2b6}
.center small{color:#98a2b6;font-size:12px}
.missed .center p{color:var(--bad);font-weight:600;font-size:18px}
.ring{border-radius:50%;animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(99,102,241,.55)}100%{box-shadow:0 0 0 44px rgba(99,102,241,0)}}
.top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:18px 20px;background:linear-gradient(#0009,transparent)}
.time{font-variant-numeric:tabular-nums;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.1);backdrop-filter:blur(12px);font-size:13px}
.remote{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:14px;padding-bottom:60px}
.remote h3{margin:0;font-size:24px}
.wave{display:flex;gap:4px;height:28px;align-items:center}
.wave i{width:4px;border-radius:2px;background:var(--acc);animation:w 1s ease-in-out infinite}
.wave i:nth-child(2){animation-delay:.15s}.wave i:nth-child(3){animation-delay:.3s}.wave i:nth-child(4){animation-delay:.45s}.wave i:nth-child(5){animation-delay:.6s}
@keyframes w{0%,100%{height:6px}50%{height:26px}}
.pip{position:absolute;right:16px;top:72px;width:92px;aspect-ratio:3/4;border-radius:16px;overflow:hidden;background:#1b2030;border:1px solid var(--line);box-shadow:0 10px 24px #0006;display:grid;place-items:center;font-size:12px;color:#98a2b6;text-align:center}
.pip video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.controls{position:absolute;left:0;right:0;bottom:22px;display:flex;justify-content:center;gap:28px}
.pill{display:flex;gap:10px;padding:10px;border-radius:999px;background:rgba(255,255,255,.1);backdrop-filter:blur(18px);border:1px solid var(--line)}
.fab{all:unset;box-sizing:border-box;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:#fff;transition:transform .15s,background .2s}
.fab:active{transform:scale(.92)}
.fab.ok{background:var(--ok);box-shadow:0 8px 24px rgba(34,197,94,.45)}
.fab.bad{background:var(--bad);box-shadow:0 8px 24px rgba(239,68,68,.4)}
.fab.ghost{background:rgba(255,255,255,.12)}.fab.ghost.off{background:#fff;color:#111}
.fab[disabled]{opacity:.35;pointer-events:none}
.act{display:grid;justify-items:center;gap:8px;font-size:13px;color:#98a2b6}
.fab:focus-visible,.row:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.spin{width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:rot .8s linear infinite;flex:none}
@keyframes rot{to{transform:rotate(360deg)}}
.resume{all:unset;margin-top:8px;padding:12px 22px;border-radius:999px;background:var(--ok);cursor:pointer;font-weight:600}

/* --- система статусів --- */
.status{position:absolute;top:62px;left:20px;display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.1);backdrop-filter:blur(14px);border:1px solid var(--line);font-size:12.5px;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.status .spin{color:#fbbf24}
.status.warn{border-color:rgba(251,191,36,.35)}
.mini{display:flex;gap:2px;align-items:flex-end;height:12px}.mini i{width:3px;border-radius:2px;background:#fbbf24}
.mini i:nth-child(1){height:4px}.mini i:nth-child(2){height:8px;opacity:.3}.mini i:nth-child(3){height:12px;opacity:.3}
.ava{position:relative;width:104px;height:104px;transition:filter .3s,opacity .3s}
.ava .avatar{position:relative;z-index:1}
.ava::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px solid transparent;transition:border-color .3s}
.badge{position:absolute;right:-2px;bottom:-2px;z-index:2;width:34px;height:34px;border-radius:50%;display:none;place-items:center;background:#1b2030;border:2px solid #0b0d12;color:#fbbf24}
.badge svg{width:16px;height:16px}
.remote[data-s="rec"] .ava{opacity:.6}
.remote[data-s="rec"] .ava::after{border-color:#fbbf24 transparent transparent transparent;animation:rot 1s linear infinite}
.remote[data-s="away"] .ava{filter:grayscale(.6);opacity:.75}
.remote[data-s="away"] .ava::after{border-color:rgba(251,191,36,.45);border-style:dashed}
.remote[data-s="hold"] .ava,.remote[data-s="peerhold"] .ava{filter:grayscale(.8);opacity:.7}
.remote[data-s="hold"] .ava::after,.remote[data-s="peerhold"] .ava::after{border-color:rgba(255,255,255,.25)}
.remote[data-s="away"] .badge,.remote[data-s="hold"] .badge,.remote[data-s="peerhold"] .badge{display:grid}
.remote[data-s="hold"] .badge,.remote[data-s="peerhold"] .badge{color:#e5e7eb}
.st{display:flex;align-items:center;gap:8px;font-size:13.5px;color:#c4cad8;animation:in .25s ease}
.st .dot{width:7px;height:7px;border-radius:50%;background:#fbbf24;animation:blink 1.2s infinite}
.remote[data-s="hold"] .st .dot,.remote[data-s="peerhold"] .st .dot{background:#9aa3b2;animation:none}
@keyframes blink{50%{opacity:.3}}
.remote[data-s="rec"] .wave i,.wave.still i{animation:none;height:6px}
/* фіксована висота: контент не стрибає між станами */
.remote{gap:12px}
.remote h3{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:32px;height:32px}
.slot{height:28px;display:flex;align-items:center;justify-content:center;max-width:100%}
.slot2{height:46px;display:flex;align-items:center;justify-content:center}
.st{white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.resume{margin:0}
.ghostslot{visibility:hidden;pointer-events:none}
/* прев'ю: ховати/показувати, індикатори мікрофона */
.pip{transition:opacity .2s}
.pipx{all:unset;position:absolute;top:5px;right:5px;z-index:3;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.55);color:#fff;cursor:pointer}
.pipx svg{width:14px;height:14px}
.pipshow{all:unset;position:absolute;right:16px;top:72px;z-index:3;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.12);backdrop-filter:blur(14px);border:1px solid var(--line);color:#fff;cursor:pointer}
.pipshow:focus-visible,.pipx:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.mmute{position:absolute;left:5px;top:5px;z-index:3;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--bad);color:#fff}
.mmute svg{width:13px;height:13px}
.mmute.sm{left:auto;right:-4px;top:-4px;bottom:auto;width:20px;height:20px;border:2px solid #0b0d12}
.mmute.sm svg{width:11px;height:11px}
.mbadge{position:absolute;left:-2px;bottom:-2px;z-index:2;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--bad);border:2px solid #0b0d12;color:#fff}
.mbadge svg{width:16px;height:16px}
.st .dot.mute{background:var(--bad);animation:none}
/* статус нашого мікрофона у верхній панелі */
.tr{display:flex;align-items:center;gap:8px}
.time{height:28px;display:flex;align-items:center;padding:0 12px}
.micoff{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--bad);color:#fff;box-shadow:0 4px 14px rgba(239,68,68,.45);animation:in .25s ease}
.micoff svg{width:15px;height:15px}
.st.muted{gap:8px}
.mi{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--bad);color:#fff;flex:none;box-shadow:0 4px 12px rgba(239,68,68,.4)}
.mi svg{width:14px;height:14px}
/* відео співрозмовника (імітація) */
.fake{position:absolute;inset:0;display:grid;place-items:end center;overflow:hidden;background:linear-gradient(160deg,#3b4a7a,#1a2036 60%,#2a1f3d);background-size:160% 160%;animation:shift 9s ease-in-out infinite alternate;transition:filter .3s}
.fake svg{width:74%;margin-bottom:-2px;transform-origin:bottom center;animation:sway 5s ease-in-out infinite alternate}
.fake:not([data-s="ok"]){filter:blur(10px) brightness(.5)}
.fake-l{position:absolute;left:20px;bottom:96px;font-size:11px;color:#cbd5e1;opacity:.75}
@keyframes shift{from{background-position:0 0}to{background-position:100% 100%}}
@keyframes sway{from{transform:translateX(-6px) rotate(-1deg)}to{transform:translateX(6px) rotate(1deg)}}
.status .pi{display:grid;color:var(--bad)}.status .pi svg{width:14px;height:14px}
.sc{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px}
.sc h4{margin:0 0 4px;font-size:14px}.sc p{margin:0 0 10px;font-size:12px;color:var(--mute);line-height:1.4}
.sc .g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sc button{all:unset;text-align:center;padding:10px 8px;border-radius:12px;background:var(--bg);border:1px solid var(--line);font-size:13px;cursor:pointer}
.sc button[disabled]{opacity:.4;pointer-events:none}
.sc button:hover{border-color:var(--acc)}
.empty{margin:4px 8px 12px;color:#98a2b6;font-size:14px;line-height:1.45}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.snd{margin-top:8px;font-size:12px;color:var(--mute);min-height:16px}
</style>
</head>
<body>
<div class="app">
  <div class="head"><b>Дзвонілка: демо фіч</b><button class="chip" id="snd"></button></div>
  <div id="root"></div>
  <div id="live" class="sr" aria-live="polite"></div>
  <div class="sc" id="sc"></div>
</div>
<script>
/* ---------- режим віджета: відкрито з demo/embed.js з токеном у URL ---------- */
const Q=new URLSearchParams(location.search),EMB=Q.has('token'),HOST=Q.get('host')||location.origin;
let token=Q.get('token'),expSent=0;
const toHost=m=>EMB&&parent!==window&&parent.postMessage(m,HOST);
const setTheme=t=>t&&t!=='auto'?document.documentElement.dataset.theme=t:delete document.documentElement.dataset.theme;
const fmt=p=>p.replace(/^\+380(\d\d)(\d{3})(\d\d)(\d\d)$/,'+380 $1 $2 $3 $4');
// контакти з «бекенду»: усі демо-користувачі, крім себе (імітація: спільний localStorage з demo/index.html)
function demoContacts(){let u=[];try{u=JSON.parse(localStorage.getItem('dialer.demo.users'))||[]}catch(e){}
  const me=token.split('.')[1];
  return u.filter(x=>x.phone!==me).map(x=>({id:x.phone,name:x.name.replace(/[<>&]/g,''),s:fmt(x.phone)+' · відповість'}));}
let contacts=EMB?demoContacts():[
 {id:'u2',name:'Олена Коваль',g:'f',s:'онлайн · відповість'},
 {id:'u3',name:'Андрій Мельник',g:'m',s:'онлайн · не відповість'},
 {id:'u4',name:'Support',g:'m',s:'у розмові · зайнято'}];
const S={state:'idle',peer:null,missed:null,mic:1,cam:1,hold:0,peerHold:0,conn:'ok',away:0,q:'excellent',sec:0,left:0,stream:null,pip:1,peerMic:1,peerCam:0};
const T={};let soundOn=true,ac,stopSnd=()=>{},sndLabel='',gen=0,inCnt=0;
const vid=Object.assign(document.createElement('video'),{autoplay:true,muted:true,playsInline:true});  // один елемент на весь дзвінок: прев'ю не миготить
const $=id=>document.getElementById(id);
const ini=n=>n.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
const mm=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
const gv=(c,f,m)=>c.g==='f'?f:m;  // дієслово в роді співрозмовника
const svg=p=>`<svg viewBox="0 0 24 24">${p}</svg>`;
const PHONE='<path class="f" d="M6.6 10.8a15 15 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11 11 0 0 0 3.6.6 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.6 3.6a1 1 0 0 1-.25 1z"/>';
const X='<path d="M6 6l12 12M18 6L6 18"/>',PAUSE='<path d="M9 5v14M15 5v14"/>';
const MIC=o=>`<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>${o?'<path d="M4 4l16 16"/>':''}`;
const CAM=o=>`<rect x="3" y="6" width="12" height="12" rx="3"/><path d="M15 10l6-3v10l-6-3"/>${o?'<path d="M4 4l16 16"/>':''}`;

/* ---------- звуки (Web Audio) ---------- */
function A(){ac??=new (window.AudioContext||window.webkitAudioContext)();ac.resume();return ac}
// iOS Safari вмикає звук лише з жесту: розблоковуємо контекст на першому дотику
document.addEventListener('pointerdown',()=>A(),{once:true});
function note(f,t,d,type,v){const c=A(),o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.02);g.gain.linearRampToValueAtTime(0,t+d);
  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.05);}
function loop(period,fn){fn();const i=setInterval(fn,period*1000);return()=>clearInterval(i)}
const SND={
  ringback:()=>loop(4,()=>note(425,A().currentTime,1,'sine',.18)),           // гудки 1с/4с
  busy:()=>loop(.7,()=>note(425,A().currentTime,.35,'sine',.18)),           // короткі
  ringtone:()=>loop(2.2,()=>{const t=A().currentTime;[659,523,659,784].forEach((f,i)=>note(f,t+i*.18,.16,'triangle',.2));}),
  hold:()=>loop(2,()=>{const t=A().currentTime;[392,494,587,494].forEach((f,i)=>note(f,t+i*.5,.45,'sine',.12));})
};
const LBL={ringback:'Гудки (вихідний дзвінок)',busy:'Сигнал «зайнято»',ringtone:'Мелодія вхідного',hold:'Мелодія утримання'};
function play(kind,ms){clearTimeout(T.snd);stopSnd();stopSnd=()=>{};sndLabel='';
  if(kind&&soundOn){const s=SND[kind]();stopSnd=s;sndLabel='♪ '+LBL[kind];if(ms){T.snd=setTimeout(()=>{s();sndLabel='';sc()},ms);}}
  sc();}
// мелодію утримання чує той, кого тримають, а не той, хто поставив на утримання
const holdSnd=()=>play(S.peerHold?'hold':null);

/* ---------- логіка дзвінка ---------- */
async function cam(){try{return await navigator.mediaDevices.getUserMedia({video:true})}catch(e){return null}}
function clearAll(){gen++;['tick','ans','rec','away'].forEach(k=>{clearInterval(T[k]);clearTimeout(T[k])});
  S.stream?.getTracks().forEach(t=>t.stop());S.stream=null;
  Object.assign(S,{hold:0,peerHold:0,conn:'ok',away:0,q:'excellent',sec:0,pip:1,peerMic:1,peerCam:0});}
function call(id){if(S.state!=='idle')return;const c=contacts.find(x=>x.id===id);S.peer=c;S.missed=null;
  if(id==='u4'){S.state='ringing';S.left=0;render();play(null);
    T.ans=setTimeout(()=>{S.state='idle';S.missed={c,reason:'busy'};play('busy',4000);render();},500);return;}  // сервер: {busy:true}
  S.state='ringing';S.left=8;play('ringback');render();
  if(id==='u2'||EMB)T.ans=setTimeout(connect,3500);
  T.tick=setInterval(()=>{S.left--;$('left')&&($('left').textContent=mm(S.left));
    if(S.left<=0){clearInterval(T.tick);S.state='idle';S.missed={c,reason:'timeout'};play(null);render();}},1000);}  // call:timeout
function incoming(){if(S.state!=='idle')return;const pool=contacts.filter(c=>c.id!=='u4');if(!pool.length)return;const c=pool[inCnt++%pool.length];S.peer=c;S.missed=null;S.state='incoming';S.left=10;play('ringtone');render();
  T.tick=setInterval(()=>{S.left--;$('left')&&($('left').textContent=mm(S.left));
    if(S.left<=0){clearInterval(T.tick);S.state='idle';S.missed={c,reason:'incoming'};play(null);render();}},1000);}
async function connect(){clearInterval(T.tick);clearTimeout(T.ans);play(null);S.state='connected';S.sec=0;S.mic=1;S.cam=1;
  T.tick=setInterval(()=>{S.sec++;$('t')&&($('t').textContent=mm(S.sec));},1000);
  render();
  const g=gen,s=await cam();
  // дзвінок могли завершити, поки чекали дозволу на камеру: тоді одразу гасимо потік
  if(g!==gen||S.state!=='connected'){s?.getTracks().forEach(t=>t.stop());return;}
  S.stream=s;s?.getVideoTracks().forEach(t=>t.enabled=!!S.cam);render();}
function hangup(){clearAll();vid.srcObject=null;play(null);S.state='idle';S.peer=null;render();}
function toggleHold(){S.hold=S.hold?0:1;holdSnd();render();}
function dropConn(){if(S.state!=='connected'||S.conn!=='ok')return;S.conn='rec';render();
  T.rec=setTimeout(()=>{S.conn='ok';render();},3500);}
function peerAway(){if(S.state!=='connected'||S.away)return;S.away=1;render();T.away=setTimeout(()=>{S.away=0;render();},6000);}
function peerHold(){if(S.state!=='connected')return;S.peerHold=S.peerHold?0:1;holdSnd();render();}
function togglePip(){S.pip=S.pip?0:1;render();}
function peerCamToggle(){if(S.state!=='connected')return;S.peerCam=S.peerCam?0:1;render();}
function peerMute(){if(S.state!=='connected')return;S.peerMic=S.peerMic?0:1;render();}
function poorQ(){if(S.state!=='connected')return;S.q=S.q==='poor'?'excellent':'poor';render();}

/* ---------- відображення ---------- */
function render(){
  const r=$('root'),p=S.peer;
  if(S.state==='idle'&&!S.missed){
    r.innerHTML=`<section class="list"><h2>Дзвінки</h2>`+(contacts.length?'':`<p class="empty">Поки тут лише ви. Відкрийте демо в іншій вкладці цього браузера й увійдіть з іншим номером: він з'явиться тут.</p>`)+contacts.map(c=>`<button class="row" data-c="${c.id}">
      <span class="avatar">${ini(c.name)}</span><span class="meta"><b>${c.name}</b><small>${c.s}</small></span>
      <span class="dial">${svg(PHONE)}</span></button>`).join('')+`</section>`;
    r.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>call(b.dataset.c));
  } else if(S.state==='idle'){
    const m=S.missed,M={busy:['Зайнято','Абонент зараз розмовляє'],timeout:['Без відповіді','Абонент не відповів (у демо 8 с, у реалі 60 с)'],incoming:['Пропущений дзвінок','Ви не відповіли на вхідний']}[m.reason];
    r.innerHTML=`<section class="stage missed"><div class="center"><span class="avatar xl dim">${ini(m.c.name)}</span><h3>${m.c.name}</h3>
      <p>${M[0]}</p><small>${M[1]}</small></div>
      <div class="controls"><div class="act"><button class="fab ghost" id="cl" aria-label="Закрити">${svg(X)}</button>Закрити</div>
      <div class="act"><button class="fab ok" id="rd" aria-label="Передзвонити">${svg(PHONE)}</button>Передзвонити</div></div></section>`;
    $('cl').onclick=()=>{S.missed=null;play(null);render();};
    $('rd').onclick=()=>{const id=m.c.id;S.missed=null;play(null);call(id);};
  } else if(S.state!=='connected'){
    const inc=S.state==='incoming';
    r.innerHTML=`<section class="stage"><div class="center"><div class="ring"><span class="avatar xl">${ini(p.name)}</span></div>
      <h3>${p.name}</h3><p>${inc?'Вхідний дзвінок…':'Дзвонимо…'}</p>
      ${S.left?`<small>Залишилось <span id="left">${mm(S.left)}</span> · таймер сервера (у демо скорочений)</small>`:''}</div>
      <div class="controls">${inc?`<button class="fab bad" id="rej" aria-label="Відхилити">${svg(X)}</button><button class="fab ok" id="acc" aria-label="Прийняти">${svg(PHONE)}</button>`
      :`<button class="fab bad" id="rej" aria-label="Скасувати">${svg(X)}</button>`}</div></section>`;
    $('rej').onclick=hangup;if(inc)$('acc').onclick=connect;
  } else {
    const st=S.hold?'hold':S.peerHold?'peerhold':S.away?'away':S.conn==='rec'?'rec':'ok';
    const fn=p.name.split(' ')[0];
    const TXT={hold:'Ви поставили на утримання',peerhold:fn+' '+gv(p,'поставила','поставив')+' на утримання',away:fn+' '+gv(p,'втратила','втратив')+' з\'єднання · чекаємо до 30 с',rec:'Відновлюємо ваше з\'єднання'};
    const BADGE=(st==='hold'||st==='peerhold')?PAUSE:'<path d="M2 8.8a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0"/><path d="M4 4l16 16"/>';
    const micLine=S.peerMic?'':fn+' '+gv(p,'вимкнула','вимкнув')+' мікрофон';  // свій мікрофон видно на своєму прев'ю
    const showAva=!S.peerCam||st!=='ok';
    const MYMUTE=cls=>S.mic?'':`<span class="${cls}" title="Ваш мікрофон вимкнено">${svg(MIC(1))}</span>`;
    const FAKE=`<div class="fake" data-s="${st}"><svg viewBox="0 0 100 130" aria-hidden="true"><circle cx="50" cy="42" r="22" fill="#5b6b9a"/><path d="M6 130c0-30 20-48 44-48s44 18 44 48z" fill="#46557f"/></svg><span class="fake-l">Відео співрозмовника (імітація)</span></div>`;
    const pill=S.conn==='rec'?`<div class="status warn"><span class="spin"></span>Відновлюємо з'єднання</div>`
      :S.q==='poor'?`<div class="status"><span class="mini"><i></i><i></i><i></i></span>Слабкий сигнал</div>`
      :(!showAva&&micLine)?`<div class="status"><span class="pi">${svg(MIC(1))}</span>${micLine}</div>`:'';
    r.innerHTML=`<section class="stage">${S.peerCam?FAKE:''}${showAva?`<div class="remote" data-s="${st}">
      <div class="ava"><span class="avatar xl">${ini(p.name)}</span><span class="badge">${svg(BADGE)}</span>${S.peerMic?'':`<span class="mbadge" title="Мікрофон вимкнено">${svg(MIC(1))}</span>`}</div><h3>${p.name}</h3>
      <div class="slot">${st==='ok'&&S.peerMic?`<div class="wave"><i></i><i></i><i></i><i></i><i></i></div>`:st==='ok'?`<div class="st"><i class="dot mute"></i>${micLine}</div>`:`<div class="st"><i class="dot"></i>${TXT[st]}</div>`}</div>
      <div class="slot2"><button class="resume ${S.hold?'':'ghostslot'}" ${S.hold?'id="rs"':'tabindex="-1" aria-hidden="true"'}>Продовжити</button></div></div>`:''}
      <header class="top"><b>${p.name}</b><span class="time" id="t">${mm(S.sec)}</span></header>
      ${pill}
      ${S.pip?`<div class="pip" id="pip">${S.cam?(S.stream?'':'Ви'):'Камера вимк.'}${MYMUTE('mmute')}
        <button class="pipx" id="px" aria-label="Сховати себе">${svg('<path d="M6 12h12"/>')}</button></div>`
      :`<button class="pipshow" id="ps" aria-label="Показати себе">${svg(CAM(0))}${MYMUTE('mmute sm')}</button>`}
      <div class="controls"><div class="pill">
        <button class="fab ghost ${S.mic?'':'off'}" id="m" ${S.hold?'disabled':''} aria-label="Вимкнути мікрофон" aria-pressed="${!S.mic}">${svg(MIC(!S.mic))}</button>
        <button class="fab ghost ${S.cam?'':'off'}" id="c" ${S.hold?'disabled':''} aria-label="Вимкнути камеру" aria-pressed="${!S.cam}">${svg(CAM(!S.cam))}</button>
        <button class="fab ghost ${S.hold?'off':''}" id="hd" aria-label="Утримання" aria-pressed="${!!S.hold}">${svg(PAUSE)}</button>
        <button class="fab bad" id="h" aria-label="Завершити">${svg(X)}</button></div></div></section>`;
    if(S.pip&&S.stream&&S.cam){if(vid.srcObject!==S.stream)vid.srcObject=S.stream;$('pip').appendChild(vid);vid.play?.().catch(()=>{});}
    $('m').onclick=()=>{S.mic=S.mic?0:1;render();};
    $('c').onclick=()=>{S.cam=S.cam?0:1;S.stream?.getVideoTracks().forEach(t=>t.enabled=!!S.cam);render();};
    if($('px'))$('px').onclick=togglePip;if($('ps'))$('ps').onclick=togglePip;$('hd').onclick=toggleHold;$('h').onclick=hangup;if($('rs'))$('rs').onclick=toggleHold;
  }
  announce();
  sc();
  toHost({type:'state',state:S.state});
}
// коротке зведення стану для скрінрідерів (live-регіон поза #root, тому не перестворюється)
function announce(){
  const p=S.peer,m=S.missed;let t='';
  if(S.state==='idle')t=m?({busy:'Зайнято',timeout:'Без відповіді',incoming:'Пропущений дзвінок'})[m.reason]+': '+m.c.name:'';
  else if(S.state==='incoming')t='Вхідний дзвінок: '+p.name;
  else if(S.state==='ringing')t='Дзвонимо: '+p.name;
  else{const fn=p.name.split(' ')[0];
    t=S.hold?'Ви поставили на утримання':S.peerHold?fn+' '+gv(p,'поставила','поставив')+' на утримання':S.away?fn+' '+gv(p,'втратила','втратив')+' з\'єднання'
      :S.conn==='rec'?'Відновлюємо з\'єднання':S.q==='poor'?'Слабкий сигнал':'Розмова з '+p.name;
    if(!S.mic)t+='. Ваш мікрофон вимкнено';if(!S.peerMic)t+='. '+fn+' '+gv(p,'вимкнула','вимкнув')+' мікрофон';}
  const l=$('live');if(l.textContent!==t)l.textContent=t;
}
function sc(){
  const con=S.state==='connected',idle=S.state==='idle';
  $('snd').textContent=soundOn?'🔊 Звук: вкл':'🔇 Звук: вимк';
  $('sc').innerHTML=`<h4>Сценарії</h4><p>Натискайте, щоб побачити фічі. Усе імітується: сервера й LiveKit тут немає.</p>
   <div class="g">
    <button id="s1" ${idle&&contacts.some(c=>c.id!=='u4')?'':'disabled'}>📲 Вхідний дзвінок</button>
    <button id="s2" ${con?'':'disabled'}>📡 Обрив зв'язку</button>
    <button id="s3" ${con?'':'disabled'}>👤 Співрозмовник зник</button>
    <button id="s4" ${con?'':'disabled'}>⏸ Співрозмовник тримає</button>
    <button id="s5" ${con?'':'disabled'}>📶 Слабкий сигнал</button>
    <button id="s6" ${con?'':'disabled'}>🎙 Мікрофон співрозмовника</button>
    <button id="s7" ${con?'':'disabled'}>📹 Камера співрозмовника</button>
   </div><div class="snd">${sndLabel}</div>`;
  $('s1').onclick=incoming;$('s2').onclick=dropConn;$('s3').onclick=peerAway;$('s4').onclick=peerHold;$('s5').onclick=poorQ;$('s6').onclick=peerMute;$('s7').onclick=peerCamToggle;
}
$('snd').onclick=()=>{soundOn=!soundOn;if(!soundOn)play(null);sc();};
if(EMB){
  setTheme(Q.get('theme'));
  // повідомлення лише від сайту-господаря, який нас вбудував
  addEventListener('message',e=>{if(e.source!==parent||e.origin!==HOST)return;const m=e.data||{};
    if(m.type==='theme')setTheme(m.theme);
    if(m.type==='token'){token=m.token;expSent=0;}
    if(m.type==='call'&&contacts.some(c=>c.id===m.id))call(m.id);});
  // хтось увійшов в іншій вкладці: оновлюємо контакти
  addEventListener('storage',e=>{if(e.key!=='dialer.demo.users')return;contacts=demoContacts();if(S.state==='idle'&&!S.missed)render();});
  addEventListener('keydown',e=>{if(e.key==='Escape')toHost({type:'close'});});  // Esc згортає панель, дзвінок триває
  const chk=()=>{if(!expSent&&+token.split('.')[2]<Date.now()){expSent=1;toHost({type:'token:expired'});}};
  setInterval(chk,15000);chk();
}
render();
toHost({type:'ready'});
</script>
</body>
