[package]
name = "dialer-mobile"
version = "0.1.0"
description = "Dialer Mobile"
authors = ["dialer"]
edition = "2021"

[lib]
name = "dialer_mobile"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-callstyle = { path = "plugins/callstyle" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

